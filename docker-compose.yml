version: '3.8'

services:
  # A2A Server - API for programmatic access
  agent-factory-a2a:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8080"  # External:8084 -> Internal:8080
    environment:
      - FRAMEWORK=tinyagent
      - MODEL=openai/o3
      - A2A_SERVER_HOST=0.0.0.0
      - A2A_SERVER_PORT=8080
      - LOG_LEVEL=info
      - CHAT=1
      - MAX_TURNS=40
      - START_MODE=a2a
    env_file:
      - .env
    volumes:
      - ./traces:/traces
    restart: unless-stopped
    command: ["./start_with_mode.sh"]
    networks:
      - agent-factory-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Chainlit Web Interface - User-friendly web UI
  agent-factory-chainlit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8004:8000"  # External:8004 -> Internal:8000
    environment:
      - FRAMEWORK=tinyagent
      - MODEL=openai/o3
      - A2A_SERVER_HOST=agent-factory-a2a  # Connect to A2A service
      - A2A_SERVER_PORT=8080
      - LOG_LEVEL=info
      - CHAT=1
      - MAX_TURNS=40
      - START_MODE=chainlit
    env_file:
      - .env
    volumes:
      - ./traces:/traces
    restart: unless-stopped
    command: ["./start_with_mode.sh"]
    depends_on:
      - agent-factory-a2a
    networks:
      - agent-factory-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  agent-factory-network:
    driver: bridge